name: Repository Quality Report

on:
  workflow_run:
    workflows:
      - Repository Quality
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: Summarize validation result
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download completion signal
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-summary
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Write durable run summary
        shell: pwsh
        run: .\scripts\ci\write-quality-report.ps1
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Enforce source conclusion
        if: github.event.workflow_run.conclusion != 'success'
        shell: pwsh
        run: |
          Write-Error "Source quality workflow did not succeed."
          exit 1
