name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, type-check, lint, and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate repository operating contract
        run: npm run validate:repository

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Capture scheduled dependency health
        if: github.event_name == 'schedule'
        continue-on-error: true
        shell: pwsh
        run: npm audit --json | Out-File -Encoding utf8 dependency-audit.json

      - name: Upload scheduled dependency health
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  completion-signal:
    name: Publish machine-readable completion signal
    if: always()
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Create completion signal
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{
            schemaVersion = 1
            workflow = "${{ github.workflow }}"
            runId = "${{ github.run_id }}"
            event = "${{ github.event_name }}"
            ref = "${{ github.ref }}"
            sha = "${{ github.sha }}"
            conclusion = "${{ needs.validate.result }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts\quality-summary.json

      - name: Upload completion signal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-summary
          path: artifacts\quality-summary.json
          retention-days: 30

      - name: Fail when validation failed
        if: needs.validate.result != 'success'
        shell: pwsh
        run: |
          Write-Error "Repository validation concluded with: ${{ needs.validate.result }}"
          exit 1
